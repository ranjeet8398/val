<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    z-index: 2;
}

h1 {
    color: #fff;
    font-size: 2.2rem;
    margin-bottom: 30px;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
}

button {
    padding: 14px 36px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

#yesBtn {
    background: #ff004f;
    color: #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

#noBtn {
    background: #444;
    color: #fff;
    position: absolute;
}

#message {
    display: none;
    margin-top: 30px;
    font-size: 1.2rem;
    color: #fff;
    animation: fadeIn 1.2s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

/* Floating hearts */
.heart {
    position: absolute;
    bottom: -20px;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
    }
}
</style>
</head>

<body>

<audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2022/02/23/audio_8f2f92a8a5.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>💖 Will you be my Valentine? 💖</h1>
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 😈</button>

    <div id="message">
        🌹 My love, you make my life brighter just by being in it.  
        <br><br>
        💕 Every heartbeat of mine whispers your name.  
        <br><br>
        💌 Today, tomorrow, and always — it’s YOU.  
        <br><br>
        ❤️ Happy Valentine’s Day, my forever ❤️
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");

// Make NO button impossible
function moveNoButton() {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// Super fast dodge
noBtn.addEventListener("mouseover", moveNoButton);
noBtn.addEventListener("mousedown", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);

// YES button action
yesBtn.addEventListener("click", () => {
    message.style.display = "block";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
});

// Floating hearts generator
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    heart.style.fontSize = (16 + Math.random() * 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 300);
</script>

</body>
</html>
